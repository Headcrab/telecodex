name: Activity observer qualification
on:
  push:
    branches: [master, 'upstream/activity-observer']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  activity:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -B tests/activity_io.py
